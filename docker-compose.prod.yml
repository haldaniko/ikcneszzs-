services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: true
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - path: .env
        required: true
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    restart: unless-stopped

  migrate:
    build: ./migration
    env_file:
      - path: .env
        required: true
    volumes:
      - ./:/workspace
      - uploads-data:/legacy-uploads:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: true
    environment:
      DATABASE_PATH: /workspace/db.sqlite3
      UPLOAD_DIR: /workspace/media
    volumes:
      - ./:/workspace
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    ports:
      - "4102:4000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_ASSET_URL: ${VITE_ASSET_URL:-https://api.ikcneszzs.xyz}
    ports:
      - "8097:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  uploads-data:
